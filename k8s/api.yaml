apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-mlflow
          image: curlimages/curl:latest
          command: ["sh", "-c",
                    "until curl -sf http://mlflow:5000/health >/dev/null; do sleep 2; done"]
        - name: wait-champion
          image: curlimages/curl:latest
          command: ["sh", "-c",
                    "until curl -sf 'http://mlflow:5000/api/2.0/mlflow/registered-models/alias?name=kaggle-champion&alias=champion' >/dev/null; do echo 'waiting for champion'; sleep 2; done"]
      containers:
        - name: api
          image: mlops-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mlops
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
