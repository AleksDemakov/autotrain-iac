apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mlflow-data, namespace: mlops}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v3.17.1
        command: ["mlflow", "server", "--port", "5000",  "--host", "0.0.0.0",
               "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
               "--artifacts-destination", "/mlflow/artifacts",
               "--serve-artifacts", "--allowed-hosts", "*"]
        ports: [{containerPort: 5000}]
        volumeMounts: [{name: data, mountPath: /mlflow}]
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: mlflow-data}
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlops}
spec:
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000}]
